# Шесть частей системы mainstay. Что каждая делает — по README.md, как она
# выглядела в моём проекте («reference») — по CASE.md.
layers:
  - name: Проверки главных правил
    rule: >-
      Тесты, которые читают сам код и падают, если правило нарушено. Например:
      каждая страница проверяет, вошёл ли человек.
    folder: guards/
    reference: >-
      {guardSuites} набора проверок. Например: на каждом адресе платформы
      стоит ограничение числа запросов; при сбое личные данные не показываются
      никому; в код для браузера не попадает то, от чего ломаются старые
      айфоны; фоновые задачи идут на дешёвой модели.
  - name: Счётчик старого долга
    rule: >-
      Старые проблемы посчитаны по файлам. Меньше — можно, больше — нельзя.
      Новая проблема сразу видна.
    folder: guards/ratchet.ts
    reference: >-
      Счётчик разовых проверок «какая это версия продукта». Их по шагам
      заменял общий список функций, который переключается без новой выкладки.
  - name: Порядок проверок
    rule: >-
      Сначала самое быстрое и дешёвое, потом долгое: нужно ли вообще
      запускать, проверки правил, тесты и сборка, тесты на настоящей базе
      данных. Отдельный сторож смотрит, что новая версия действительно
      выложена.
    folder: ci/
    reference: >-
      Тот же порядок. Тесты идут на настоящей базе Postgres, где все изменения
      базы применяются с нуля. Сторож выкладки срабатывает каждые
      {watchdogHours} {hoursWord}.
  - name: Проверки для вашего ИИ-агента
    rule: >-
      Если в продукте есть свой ИИ-агент, проверяется не он, а программа: что
      она сделает на каждую его просьбу. Откажет, покажет человеку карточку на
      подтверждение или разрешит. Любое действие, которое что-то меняет, идёт
      через такую карточку.
    folder: evals/
    reference: >-
      Список из {refusalCases} случая для агента владельца клуба, тесты
      очистки текста в {sanitizerModules} модулях и правило «деньги — опасно»
      в {toolModules} модулях с инструментами.
  - name: Правила для агента-разработчика
    rule: >-
      Файл, который агент читает перед каждой задачей: сначала разберись, не
      пиши прямо в основную версию, у каждого изменения есть тест. Плюс
      проверка перед отправкой кода и список для того, кто принимает
      изменение.
    folder: agent/
    reference: >-
      Файл правил проекта, отдельные сценарии для проверки безопасности и для
      аудита, проверки правил перед каждой отправкой кода.
  - name: Сломалось — появилась проверка
    rule: >-
      Каждая ошибка, дошедшая до людей, заканчивается проверкой в том же
      изменении, что и исправление. Так этот вид ошибки не возвращается. Шесть
      цифр показывают, стало ли лучше.
    folder: metrics/
    reference: >-
      Ошибки из браузеров сами попадают в общий список. Ошибка в работающем
      продукте становится проверкой в тот же день.
