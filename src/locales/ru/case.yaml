# Страница с цифрами. Она повторяет CASE.md открытого проекта mainstay; сами
# цифры и команды берутся из src/data/case.ts. Язык — как на всём сайте:
# короткие фразы и простые слова.

meta:
  title: "Один инженер, ИИ-агент и {mergedPrs} изменения: цифры"
  description: >-
    Catch Club: один инженер и Claude Code, восемь месяцев, {mergedPrs}
    принятых изменения, {unitTests} тестов. Откуда каждая цифра и как её
    перепроверить.

hero:
  title: "Один инженер, ИИ-агент и {mergedPrs} изменения за восемь месяцев"
  lead: >-
    Catch Club — платформа для платных сообществ в Telegram. В ней есть
    кабинет владельца, боты, мини-приложения, платежи и ИИ-агенты. Я делал её
    один, с агентом Claude Code, с {periodStart} по {periodEnd}. Большую часть
    кода написал агент. Ниже — что из этого вышло в цифрах.

summary:
  title: Коротко
  text: >-
    Код Catch Club закрыт. Открыта только его система проверок — проект
    mainstay. В нём нет кода продукта, названий сообществ, имён участников и
    секретов.
  items:
    - term: Кто
      value: Один инженер, {authorName}, и ИИ-агент Claude Code.
    - term: Когда
      value: С {periodStart} по {periodEnd}. Цифры сняты {asOf}.
    - term: Что сделано
      value: >-
        Сайт, боты, мини-приложения, платежи и ИИ-агенты: {tsLines} строк кода
        на TypeScript, не считая тестов.
    - term: Что проверяло каждое изменение
      value: >-
        {unitTests} тестов, {integrationTests} тестов на настоящей базе данных
        и {guardSuites} набора проверок главных правил.

numbers:
  title: Цифры
  intro: >-
    Сняты {asOfFrom} и {asOf}: из запуска проверок {ciRun} и из состояния
    проекта на этот момент.
  rows:
    - value: "{unitTests}"
      label: тестов проходит, в {unitTestFiles} файлах
      source: запуск проверок; сами тесты идут {unitTestsDuration}
    - value: "{integrationTests}"
      label: тестов на настоящей базе данных
      source: тот же запуск; перед ними все изменения базы применяются с нуля
    - value: "{ciFull}"
      label: идёт полная проверка одного изменения
      source: быстрая проверка «нужно ли запускать» — {ciShouldRun}; потом тесты и сборка — {ciTestsAndBuild}; рядом с ними тесты на базе — {ciIntegration}
    - value: "{guardSuites}"
      label: набора проверок главных правил
      source: проект
    - value: "{mergedPrs}"
      label: изменения принято в основной код
      source: GitHub
    - value: "{commits}"
      label: сохранений кода за {days} дней
      source: проект
    - value: "{migrations}"
      label: изменения структуры базы данных, в {databases} базах
      source: проект
    - value: "{tsLines}"
      label: строк кода в {sourceFiles} файлах, не считая тестов
      source: проект
    - value: "{decisionDocs}"
      label: "документа с решениями: что делаем и почему"
      source: проект

recent:
  title: Последние 30 дней
  intro: По {l30Until}. Посчитано открытым скриптом из mainstay.
  rows:
    - value: "{l30MergedPrs}"
      label: изменение принято
    - value: "{l30WithTestsPct}"
      label: изменений кода пришли с правкой тестов ({l30WithTests} из {l30CodePrs})
    - value: "{l30RedPct}"
      label: "запусков проверок были красными: {l30Red} красных, {l30Green} зелёных. Ещё {l30Skipped} запуска пропущены как ненужные, {l30Cancelled} отменены"
    - value: "{l30Median} / {l30P90} мин"
      label: "столько идёт проверка: в половине случаев не дольше первого числа, в девяти из десяти — не дольше второго"
    - value: "{l30FlakyPct}"
      label: "случаев, когда проверка без причины то падала, то проходила: {l30FlakyCommits} из {l30Commits}"
    - value: "{l30MainRed}"
      label: "раз проверки упали на основной версии кода: {l30MainGreen} запусков прошли, {l30MainCancelled} отменены"

reproduce:
  title: Как перепроверить
  intro: >-
    Код и журнал проверок закрыты. Но каждую цифру можно получить командой — в
    копии проекта с доступом на чтение, на сохранении {commit}. Более поздние
    изменения меняют числа. По просьбе я запускаю эти команды при вас.
  testCounts: "Сколько тестов и сколько они идут — из журнала запуска:"
  outputNote: >-
    Показано без меток времени. У тестов на базе «Duration» — время самих
    тестов; в {ciIntegration} всей задачи входят запуск базы и применение
    изменений.
  guardSuites: "Наборы проверок правил:"
  rest: "Остальное — там же:"
  after: Когда цифры обновляются, команды запускаются заново.

layers:
  title: Из чего состоит система
  intro: Частей шесть. У каждой написано, как она выглядела в моём проекте.

limits:
  title: Чего здесь нет
  items:
    - >-
      Тестов, которые сами кликают по сайту. Экраны в Telegram я проверяю
      руками, по списку.
    - >-
      Проверка под нагрузкой была один раз, в августе 2026 года. В постоянные
      проверки она не входит.
    - >-
      Ошибки, которые дошли до людей, пока отдельно не считаются. С этого и
      стоит начинать у себя.
    - >-
      Это опыт одного человека. Команде из тридцати человек нужна та же
      система, но настроенная иначе: у проверок должны быть хозяева, сначала
      замер, потом цели.

closing:
  title: Откуда эти цифры
  text: >-
    Эта страница повторяет файл
    [CASE.md](https://github.com/Kamtomir/mainstay/blob/main/CASE.md) из
    открытого проекта. Если они разойдутся, прав CASE.md.
