faq:
  title: Вопросы
  items:
    - q: Что именно вы проверяете, а что нет?
      a: >-
        Места, где ошибка стоит дороже всего: деньги, доступы, личные данные
        и то, что разрешено вашему собственному ИИ. Писать новые функции и
        чинить ваш код в работу не входит. Как и тесты, которые кликают по
        сайту, проверка под нагрузкой и поиск уязвимостей взломом.
    - q: Как вы решаете, какие риски важны для нашего проекта?
      a: >-
        Сначала разбираюсь, кто ваши клиенты и что продукт для них делает.
        Потом смотрю, где у него сильные места и где узкое. Из этого видно, где
        ошибка обойдётся вам дороже всего. Обычно это деньги, доступы или
        личные данные.
    - q: Почему пять рабочих дней?
      a: >-
        Столько занимает один проект. В эти дни входит вся работа: дорогие
        места, проверки для них, правила для агента и план. Доступ нужен на
        эту неделю, потом вы его закрываете. Цена по ходу работы не меняется.
    - q: Кто читает наш код — вы или ИИ?
      a: >-
        ИИ-агент Claude Code. Я им руковожу, проверяю каждую находку и отвечаю
        за отчёт. Находка — это не мнение модели. Это проверка, которая падает
        на вашем коде. Её можно запустить ещё раз и убедиться.
    - q: Наш код уйдёт в компанию, которая делает ИИ?
      a: >-
        Да, в Anthropic: агент — это их Claude Code. Он работает под моим
        коммерческим аккаунтом, а не под личной подпиской. На этих условиях
        ваш код не используют для обучения моделей, и это записано в нашем
        договоре. Если вам так нельзя, агент будет работать под вашим
        аккаунтом.
        [Что Anthropic делает с данными](https://code.claude.com/docs/en/data-usage).
    - q: Какой доступ вам нужен?
      a: >-
        К одному проекту, на неделю: читать код, видеть результаты проверок и
        предлагать изменения. Доступ к работающему сайту и ваши пароли мне не
        нужны. Работаю в облаке GitHub, рядом с вашим кодом, и к себе его не
        копирую. Закрываете доступ — облачная среда удаляется.
    - q: А можно вообще без доступа?
      a: >-
        Можно. Тогда агента запускает ваш разработчик, у себя и под вашим
        аккаунтом ИИ. Я веду по созвону и проверяю находки на общем экране.
        Понадобится время вашего разработчика.
    - q: Вы подписываете NDA?
      a: >-
        Да, до того как увижу код. Конфиденциальность есть в моём договоре.
        Если у вас свой NDA, присылайте. Для первого созвона он не нужен:
        кода я не вижу.
    - q: Вы будете менять наш код?
      a: >-
        Нет. Я добавляю проверки и правила для агента, и только
        предложениями, которые принимает ваша команда. Если проверка красная,
        это находка. Чинить или записать исключение, решаете вы.
    - q: Чем это лучше ИИ-бота, который проверяет код?
      a: >-
        Бот высказывает мнение. Сегодня одно, завтра другое. Проверка даёт
        один и тот же ответ на один и тот же код. А правило записано в вашем
        проекте, и его видно. Одно другому не мешает.
    - q: А если у нас не Claude Code?
      a: >-
        Проверкам всё равно, кто писал код. Они работают и с другим агентом, и
        с человеком. Плагин сделан под Claude Code, но всё то же можно
        поставить руками, минут за {setupMinutes}.
    - q: Вы гарантируете, что ошибок не будет?
      a: >-
        Нет. Проверка ловит тот вид ошибок, под который написана. Про каждую
        честно сказано, чего она не видит. Зато для ошибки, которая уже
        случалась, появляется своя проверка. В следующий раз её ловит она.
    - q: Чем бесплатный плагин отличается от платной работы?
      a: >-
        Плагин ставит общие проверки: например, что каждый адрес API проверяет
        вход. Вы запускаете его сами, в своём Claude Code. Платная работа — про
        правила именно вашего продукта: ваши деньги, доступы и данные. Сначала
        их нужно найти в вашем коде. Это и есть пять рабочих дней: с отчётом,
        проверками, правилами и планом.
    - q: Что будет, если поставить только бесплатный плагин?
      a: >-
        Он напишет первые проверки под ваш проект, запустит их и покажет
        находки. Сам ничего не чинит и не сохраняет без вашего «да». Если
        этого хватит, платная работа не нужна.

about:
  title: Обо мне
  paragraphs:
    - >-
      Меня зовут {authorName}, я инженер. Восемь месяцев я один делал
      [Catch Club]({productUrl}) — платформу для платных сообществ в Telegram.
      Там есть кабинет владельца, боты, мини-приложения, платежи и ИИ-агенты.
      Код писал в основном агент Claude Code.
    - >-
      Чтобы это не развалилось, я по ходу собрал систему проверок. Потом вынес
      её в открытый проект [mainstay](https://github.com/Kamtomir/mainstay).
      Он бесплатный.
    - Эта услуга — та же система, настроенная под ваш проект.

# Блок для поисковиков и ИИ-поиска: каждое предложение понятно без остальной
# страницы. Стоит внизу, после человеческого рассказа. Строка с ценой
# вставляется сама, после «Срок».
facts:
  title: Коротко
  summary: >-
    {authorName} проверяет проекты, где код пишут ИИ-агенты, и ставит в них
    автоматические проверки: они срабатывают на каждом изменении и ловят
    ошибки в деньгах, доступах и личных данных.
  items:
    - term: Услуга
      value: >-
        Аудит и установка системы качества для разработки с ИИ-агентами.
        Делает {authorName} в проекте клиента.
    - term: Для кого
      value: >-
        Для основателей, технических директоров и разработчиков, у которых код
        пишут ИИ-агенты.
    - term: Что получает клиент
      value: >-
        Список опасных мест, работающие проверки, правила для агента и план на
        90 дней.
    - term: Срок
      value: Пять рабочих дней.
    - term: Как идёт работа
      value: >-
        Код читает ИИ-агент Claude Code. {authorName} руководит им, проверяет
        каждую находку и отвечает за отчёт.
    - term: Где остаётся код
      value: >-
        В облачной среде GitHub рядом с проектом клиента. На свой компьютер
        аудитор код не копирует.
    - term: Провайдер ИИ
      value: >-
        Claude Code отправляет код в Anthropic под коммерческим аккаунтом
        аудитора: там код не используют для обучения моделей. Расход на агента
        входит в цену. По просьбе клиента агент работает под его аккаунтом.
    - term: Бесплатная часть
      value: >-
        mainstay — открытый набор проверок под лицензией MIT и плагин для
        Claude Code. Ставится тремя командами.
    - term: На чём проверено
      value: >-
        Catch Club: один инженер и Claude Code за восемь месяцев, с
        {periodStart} по {periodEnd}; {unitTests} тестов, {integrationTests}
        тестов на настоящей базе данных, {mergedPrs} принятых изменения.
    - term: Технологии
      value: >-
        Готовые проверки mainstay написаны для TypeScript, Vitest и GitHub
        Actions.
    - term: С чего начать
      value: >-
        С бесплатного созвона на 20 минут: напишите {consultHandle} в
        Telegram.

closing:
  title: Начните с 20 минут
  text: >-
    Расскажите, что у вас за проект и что в нём пишет агент. На созвоне
    покажете, что нашёл плагин. Дальше решите сами.
