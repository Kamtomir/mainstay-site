# Главная страница.
#
# Пишется голосом автора: короткие фразы, одна мысль — одно предложение,
# свои истории вместо общих слов. Термин объясняется простыми словами там, где
# встречается впервые.
#
# {подстановки} берутся из src/data/case.ts (цифры из CASE.md) и site.config.mjs
# (цена, контакт). Разметка внутри строк: `код`, **жирный**, [текст](/путь/).
# Числа подставляются сами, а окончания слов рядом с ними написаны руками:
# если цифры в CASE.md изменятся, проверьте «набора», «изменения», «тестов».

meta:
  title: "Проверки для кода, который пишет ИИ | Камиль Дашдамиров"
  description: >-
    За пять рабочих дней ставлю в ваш проект проверки, которые ловят ошибки
    ИИ-агента до того, как их увидят клиенты: деньги, доступы, личные данные.

hero:
  # Перенос строки (\n) ставит вторую фразу на свою строку.
  title: "Код пишет ИИ.\nА кто его проверяет?"
  # У каждого шага истории слева своя короткая пометка: когда это было.
  story:
    - when: 8 месяцев
      text: >-
        Восемь месяцев я делал продукт вдвоём с ИИ-агентом. Он писал код, я
        ставил задачи. В день выходило пять-шесть изменений. Читать всё я не
        успевал.
    - when: однажды
      text: >-
        Однажды в код попала одна строка. Тесты прошли. А у людей со старыми
        айфонами **перестала открываться страница**. Я узнал об этом из
        отчётов об ошибках.
    - when: тогда
      text: >-
        Тогда я понял простую вещь. Агента бесполезно просить «будь
        внимательнее». Нужна **проверка, которая сама поймает такую ошибку** —
        до того, как её увидят люди.
    - when: сейчас
      text: >-
        Сейчас таких проверок у меня {guardSuites} набора. Могу поставить
        такие же в ваш проект. За пять рабочих дней.
  artifactCaption: >-
    Так выглядит пойманная ошибка. Проверка называет файл и говорит, что
    написать вместо этого.
  # Кнопка под картинкой: «починить» ошибку и вернуть её обратно.
  fix:
    run: Исправить и запустить снова
    back: Вернуть ошибку
    caption: >-
      Ошибку исправили. Проверка зелёная, и дальше запускаются тесты и
      сборка.

approach:
  title: Что я делаю
  lead: Сначала нахожу места, где ошибка стоит дорого. Обычно их три.
  # Три плитки: место и пример проверки для него.
  placeLabel: пример проверки
  places:
    - name: Деньги
      rule: Ни один счёт не уходит без подтверждения человека.
    - name: Доступы
      rule: Каждая страница сначала проверяет, вошёл ли человек.
    - name: Личные данные
      rule: Если что-то сломалось, чужие данные не показываются никому.
  paragraphs:
    - >-
      На каждое место ставлю проверку. Она простая: читает код и смотрит,
      выполнено ли правило. Агент забыл — проверка красная. Команда видит это
      сразу, а не от клиента.
    - >-
      Проверке всё равно, кто писал код: человек или агент. Она срабатывает
      на каждом изменении. И не устаёт.
    - >-
      Работаю я тоже с агентом и говорю об этом прямо. Ваш код читает он.
      Каждую его находку проверяю я. За отчёт отвечаю тоже я.

audience:
  title: Кому это нужно
  fitsTitle: Вам ко мне, если
  fits:
    - >-
      код в основном пишет ИИ-агент, и вы не успеваете читать всё, что он
      приносит;
    - >-
      в продукте есть деньги, права доступа или личные данные, и ошибка там
      стоит дорого;
    - >-
      вы основатель, технический директор или разработчик, который нажимает
      «принять»;
    - >-
      проект написан на TypeScript и лежит на GitHub. Мои готовые проверки
      сделаны под них.
  notTitle: Не ко мне, если
  notFits:
    - >-
      нужно, чтобы кто-то писал новые функции или чинил код за вас. Я нахожу
      проблемы, а что менять, решаете вы;
    - >-
      нужны тесты, которые сами кликают по сайту, проверка под нагрузкой или
      поиск уязвимостей взломом. Этого я не делаю;
    - >-
      у вас другой язык или другая площадка для кода. Напишите всё равно: за
      20 минут поймём, подойдёт ли подход.

deliverables:
  title: Что вы получаете за пять рабочих дней
  intro: Четыре вещи. Все они остаются у вас.
  # tag — короткая пометка на карточке: что это за файл или папка.
  items:
    - tag: отчёт
      title: Список опасных мест
      text: >-
        Где агент может сломать деньги, доступы и личные данные. По каждому
        месту — файл, строка и что не так.
    - tag: test/guards
      title: Проверки, которые уже работают
      text: >-
        Они запускаются сами на каждое изменение. Сначала быстрые, потом
        долгие. Старые проблемы не чиним все сразу: считаем их и ставим
        правило «меньше можно, больше нельзя».
    - tag: CLAUDE.md
      title: Правила для вашего агента
      text: >-
        Короткий файл, который агент читает перед каждой задачей. И проверка,
        которая срабатывает ещё до отправки кода.
    - tag: 90 дней
      title: План на 90 дней
      text: >-
        Что добавить дальше, кто за это отвечает и по каким цифрам смотреть,
        стало ли лучше.
  note: >-
    Без вашего «да» я ничего не чиню и не принимаю в код. Красная проверка —
    это вопрос к вашей команде: исправить или записать, почему здесь можно.

process:
  title: Как это проходит
  # Две части: что бесплатно и что входит в платную работу.
  phases:
    - kind: free
      label: Сначала бесплатно
      steps:
        - title: Вы ставите бесплатный плагин
          text: >-
            Это три команды. Плагин сам пишет первые проверки под ваш проект и
            показывает, что они нашли. [Как он устроен](/plugin/).
        - title: Созваниваемся на 20 минут
          text: >-
            Вы показываете экран с находками. Кода я не вижу и доступа не
            прошу. Решаем, нужна ли платная работа. Если хватает плагина, на
            этом и останавливаемся.
    - kind: paid
      label: Потом платная работа — пять рабочих дней
      steps:
        - title: Подписываем договор, вы даёте доступ
          text: >-
            В договоре — конфиденциальность и то, какой ИИ читает ваш код.
            Доступ нужен к одному проекту, на неделю. Работаю в облаке GitHub,
            рядом с вашим кодом. К себе на компьютер его не копирую.
        - title: Агент читает код, я проверяю находки
          text: >-
            Смотрим туда, где ошибка дороже всего: платежи, доступы, личные
            данные и то, что разрешено вашему собственному ИИ. Каждая находка
            — это проверка, которая падает на вашем коде. Вы можете запустить
            её сами.
        - title: Проверки приходят к вам на утверждение
          text: >-
            Не напрямую в код, а предложениями. Их смотрит и принимает ваша
            команда.
        - title: Передаю всё вам
          text: >-
            Список опасных мест, правила для агента и план. Вы закрываете мне
            доступ, и облачная среда удаляется вместе с ним. Проверки остаются
            обычными файлами в вашем проекте. Подписки нет.

proof:
  title: Что получилось у меня
  intro: >-
    У каждого проекта свои цифры. Вот те, что я измерил у себя. Catch Club —
    платформа для платных сообществ в Telegram. Я делал её один, с агентом Claude Code, с
    {periodStart} по {periodEnd}. Большую часть кода написал агент.
  # Три главных числа — крупно.
  big:
    - value: "{mergedPrs}"
      label: изменения принято в основной код за восемь месяцев
      source: GitHub
    - value: "{unitTests}"
      label: тестов проходит на каждом изменении
      source: запуск проверок {ciRun}
    - value: "{l30MainRed}"
      label: раз за 30 дней проверки упали на основной версии кода
      source: "по {l30Until}"
      zero: true
  # Остальные числа — сеткой.
  stats:
    - value: "{integrationTests}"
      label: тестов на настоящей базе данных
    - value: "{guardSuites}"
      label: набора проверок главных правил
    - value: "{ciFull}"
      label: идёт полная проверка одного изменения
    - value: "{tsLines}"
      label: строк кода, не считая тестов
    - value: "{l30RedPct}"
      label: запусков проверок за 30 дней были красными — все в черновиках
    - value: "{l30WithTestsPct}"
      label: изменений кода пришли с правкой тестов
    - value: "{l30Median} мин"
      label: обычно идёт проверка одного изменения
    - value: "{l30MergedPrs}"
      label: изменение принято за последние 30 дней
  # Картинка из точек: каждая точка — один запуск проверок.
  runsTitle: "Запуски проверок за 30 дней, по {l30Until}"
  runs:
    all: "Все запуски, которые дошли до конца: {l30Green} зелёных и {l30Red} красных. Каждая точка — один запуск."
    main: "Запуски на основной версии кода: {l30MainGreen} зелёных, красных нет."
  limitsTitle: Чего эти цифры не говорят
  limits:
    - >-
      Это опыт одного человека. Большой команде нужна та же система, но
      настроенная иначе: у каждой проверки должен быть хозяин.
    - >-
      Тестов, которые сами кликают по сайту, у меня нет. Экраны в Telegram я
      проверяю руками, по списку.
    - Ошибки, которые всё-таки дошли до людей, я пока отдельно не считаю.
  more: >-
    Все цифры, откуда они взяты и как их перепроверить — на
    [странице с цифрами](/case/).

