    - label: LICENSE
      href: https://github.com/Kamtomir/mainstay/blob/main/LICENSE
      note: лицензия MIT

faq:
  title: Вопросы о плагине
  items:
    - q: Почему проверки, а не правила линтера?
      a: >-
        Где хватает линтера, берите линтер. Проверка — это обычный тест строк
        на двадцать, на том же языке, что и ваши тесты. Она видит сразу много
        файлов, SQL и настройки. А исключения записаны рядом с правилом, и у
        каждого есть причина.
    - q: Плагин что-нибудь скачивает или отправляет?
      a: >-
        Нет. Это одна инструкция для Claude Code и копия файлов, которые она
        ставит. Файлы берутся из папки плагина, из сети он ничего не тянет.
        Работает он внутри вашей сессии Claude Code, как любая ваша задача.
    - q: С какими фреймворками он знаком?
      a: >-
        Для проверки адресов API: Next.js, SvelteKit, Express, Fastify и Hono.
        С другими он сначала опишет, что нашёл, и спросит, прежде чем писать.
    - q: Проверка ругается на файл, где так и задумано. Что делать?
      a: >-
        Записать файл в исключения и указать причину. Без причины исключение
        не примется. А если оно перестало быть нужным, проверка сама об этом
        скажет.
    - q: Почему проекта нет в npm?
      a: >-
        Нарочно. Это файлы, которые вы копируете и читаете целиком. Нет чужих
        обновлений и нет зависимости от меня.

closing:
  title: А правила вашего продукта?
  text: >-
    Плагин ставит общие проверки. Правила про ваши деньги, ваши доступы и ваши
    данные нужно сначала найти. Это и есть платная работа.
