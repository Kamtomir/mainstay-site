# Страница плагина. Читают её разработчики, но язык тот же: короткие фразы,
# простые слова. Факты — из README.md открытого проекта mainstay и из
# инструкции плагина; сами команды лежат в src/data/case.ts.

meta:
  title: "mainstay: бесплатный плагин с проверками для Claude Code"
  description: >-
    Три команды — и в вашем проекте появляются первые проверки. Они читают код
    и падают, если нарушено главное правило. Бесплатно, код открыт.

hero:
  title: "Бесплатный плагин: первые проверки за три команды"
  lead: >-
    mainstay — мой открытый набор проверок для проектов, где код пишет
    ИИ-агент. Проверки читают сам код и падают, если нарушено правило. Плагин
    ставит их в ваш проект через Claude Code. Бесплатно.

install:
  title: Как поставить
  steps:
    - text: В Claude Code подключите каталог с плагином.
      command: marketplaceAdd
    - text: Установите плагин.
      command: install
    - text: Откройте свой проект и запустите настройку.
      command: setup
  after: Настройка сначала спросит, что ставить. И только потом что-то запишет.

does:
  title: Что он сделает
  items:
    - "Спросит, что вам нужно: проверки, порядок их запуска, правила для агента."
    - >-
      Напишет первые проверки под ваш проект. Каждый адрес API проверяет,
      вошёл ли человек. В код для браузера не попадают серверные ключи. И не
      попадает то, от чего ломаются старые айфоны.
    - >-
      Посчитает, сколько раз в коде отключена проверка типов (`as any`,
      `@ts-ignore`). И поставит правило: меньше можно, больше нельзя.
    - >-
      Добавит запуск проверок на каждое изменение, проверку перед отправкой
      кода и файл правил `CLAUDE.md`.
    - Запустит всё это и покажет, что нашлось.

doesNot:
  title: Чего он не сделает
  items:
    - Ничего не починит и не сохранит без вашего «да».
    - >-
      Не тронет код продукта. Красная проверка — это находка для вас, а не
      задача для агента.
    - Не перезапишет ваши файлы. Сравнит, покажет разницу и спросит.
    - >-
      Не поставит лишнего. При установке не ставит пакеты и не добавляет в
      ваши сессии ни хуков, ни MCP-серверов.
    - Не отправит код и не откроет запрос на изменение, пока вы не попросите.

output:
  title: Как выглядит найденная ошибка
  intro: >-
    Проверка говорит три вещи: какое правило нарушено, в каком файле и что
    написать вместо этого.
  after: >-
    Дальше два честных пути: исправить код или записать, почему этому файлу
    можно. Ослаблять саму проверку ради зелёного цвета нельзя.

needs:
  title: Что нужно
  items:
    - Проект в git с файлом `package.json`.
    - Node 20 или новее.
    - Vitest. Если его нет, настройка предложит добавить.
    - Claude Code — чтобы запустить плагин.

manual:
  title: Если у вас не Claude Code
  text: >-
    Всё то же можно поставить руками. Это обычные файлы: вы копируете их к
    себе, и они ваши. В npm проекта нет, и это нарочно. В README есть
    пошаговая настройка на {setupMinutes} минут для проекта на TypeScript.
    Ниже — первая проверка оттуда.
    [Открыть настройку](https://github.com/Kamtomir/mainstay#15-minute-setup-for-a-typescript-repository).

layers:
  title: Из чего состоит вся система
  intro: >-
    Частей шесть. Плагин ставит три: проверки правил со счётчиком старого
    долга, порядок запуска и правила для агента. Остальные лежат в открытом
    проекте, их можно взять оттуда.

links:
  title: Где всё лежит
  items:
    - label: Открытый проект на GitHub
      href: https://github.com/Kamtomir/mainstay
      note: проверки, плагин и их тесты
    - label: README.md
      href: https://github.com/Kamtomir/mainstay/blob/main/README.md
