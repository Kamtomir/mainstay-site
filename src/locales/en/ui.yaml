# The six parts of mainstay. What each one does follows README.md; what it
# looked like in the author's project ("reference") follows CASE.md.
layers:
  - name: Checks for the main rules
    rule: >-
      Tests that read the code itself and fail when a rule is broken. For
      example: every page checks that the person is signed in.
    folder: guards/
    reference: >-
      {guardSuites} sets of checks. For example: every API route of the
      platform has a request limit; when something fails, personal data is shown to
      no one; code for the browser has nothing that breaks older iPhones;
      background jobs run on a cheaper model.
  - name: A counter for old debt
    rule: >-
      Old problems are counted file by file. Fewer is fine, more is not. A new
      problem is visible at once.
    folder: guards/ratchet.ts
    reference: >-
      A counter of one-off checks of “which version of the product is this”.
      Step by step they were replaced by one list of features that can be
      switched on without a new release.
  - name: The order of checks
    rule: >-
      The fastest and cheapest first, the slow ones after: whether to run at
      all, the rule checks, the tests and the build, the tests on a real
      database. A separate watchdog checks that the new version is really
      live.
    folder: ci/
    reference: >-
      The same order. The tests run on a real Postgres database, where every
      database change is applied from scratch. The release watchdog runs every
      {watchdogHours} hours.
  - name: Checks for your own AI agent
    rule: >-
      If the product has its own AI agent, the check is on the program, not on
      the agent: what the program does with each of its requests. It refuses,
      shows a person a card to confirm, or allows. Any action that changes
      something goes through such a card.
    folder: evals/
    reference: >-
      A list of {refusalCases} cases for the club owner's agent, tests of text
      cleaning in {sanitizerModules} modules, and the rule “money is
      dangerous” in {toolModules} modules with tools.
  - name: Rules for the coding agent
    rule: >-
      A file the agent reads before every task: look first, do not write
      straight into the main version, every change has a test. Plus a check
      before the code is sent and a list for whoever accepts the change.
    folder: agent/
    reference: >-
      The project's rules file, separate routines for security checks and for
      audits, rule checks before every send.
  - name: It broke, so a check appeared
    rule: >-
      Every mistake that reached people ends with a check in the same change
      as the fix. That kind of mistake does not come back. Six numbers show
      whether things got better.
    folder: metrics/
    reference: >-
      Errors from browsers land in one list by themselves. A mistake in the
      live product becomes a check the same day.
