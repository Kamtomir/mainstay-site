# The landing page.
#
# Written in the author's voice: short sentences, one thought per sentence, his
# own stories instead of general claims. A term is explained in plain words
# where it first appears.
#
# The reader comes first: where a sentence can be about "you", "your team" or
# the thing itself ("the check", "the report"), it is. "I" stays where it is a
# fact about the author or his responsibility: the story, who checks the
# findings, who answers for the report, the promises about code and the NDA.
# Never "we" for the service: one person does the work. "We" only means "you
# and I", as in "we talk for 20 minutes".
#
# {placeholders} come from src/data/case.ts (numbers from CASE.md) and
# site.config.mjs (price, contact). Inline markup: `code`, **bold**,
# [text](/path/ or https://...).

meta:
  title: "Checks for code written by AI agents | Kamil Dashdamirov"
  description: >-
    Checks for your project that catch an AI agent's mistakes in money, access
    and personal data before your customers do. Set up in five working days.

hero:
  # The line break (\n) puts the second sentence on its own line.
  title: "AI writes the code.\nWho checks it?"
  # Each step of the story has a short mark on the left: what this step is
  # about. Not a time: readers took "8 months" and "today" for deadlines.
  # The column is narrow (6.5rem), so a mark is one or two short words.
  story:
    - when: My project
      text: >-
        For eight months I built a product with an AI agent. It wrote the
        code, and I set the tasks. Five or six changes went out every day. I
        could not read them all.
    - when: The bug
      text: >-
        One day a single line got into the code. The tests passed. But on
        older iPhones **the page stopped opening**. I found out from the error
        reports.
    - when: The lesson
      text: >-
        Then I understood a simple thing. Asking an agent to “be more careful”
        does not work. You need **a check that catches the mistake by itself**,
        before people see it.
    - when: Your project
      text: >-
        Today my project has {guardSuites} sets of such checks. Your project
        can have its own. In five working days I find where a mistake would
        cost you the most and put checks there.
  artifactCaption: >-
    This is what a caught mistake looks like. The check names the file and
    says what to write instead.
  # The button under the picture: "fix" the mistake and bring it back.
  fix:
    run: Fix it and run again
    back: Bring the mistake back
    caption: >-
      The mistake is fixed. The check is green. Next come the tests and the
      build.

approach:
  title: What gets checked
  lead: First, the places where a mistake is expensive. Usually there are three.
  # Three tiles: the place and an example of a check for it.
  placeLabel: an example check
  places:
    - name: Money
      rule: No invoice goes out unless a person confirms it.
    - name: Access
      rule: Every page first checks that the person is signed in.
    - name: Personal data
      rule: When something breaks, no one sees other people's data.
  paragraphs:
    - >-
      Each place gets its own check. It is simple: it reads the code and sees
      whether the rule is kept. If the agent forgets the rule, the check goes
      red. Your team sees it at once, not from a customer.
    - >-
      The check does not care who wrote the code: a person or an agent. It
      runs on every change. And it does not get tired.
    - >-
      I work with an agent too, and I say so openly. The agent reads your
      code. I check every finding it makes. And I am responsible for the
      report.

audience:
  title: Who this is for
  # Both lists have one form: every item starts with "you".
  fitsTitle: This is for you if
  fits:
    - >-
      you let an AI agent write most of your code, and you cannot read
      everything it brings;
    - >-
      you have money, access rights or personal data in your product, and a
      mistake there is expensive;
    - >-
      you are the founder, the CTO or the developer who presses “merge”;
    - >-
      you write in TypeScript and keep your code on GitHub. The ready-made
      checks are built for both.
  notTitle: This is not for you if
  notFits:
    - >-
      you need someone to build features or fix the code for you. The audit
      finds the problems; what to change is up to you;
    - >-
      you need tests that click through your site by themselves, load testing
      or a penetration test. These are not part of the work;
    - >-
      you use another language, or keep your code somewhere other than
      GitHub. Write anyway: a 20-minute call will show whether the approach
      fits.

deliverables:
  title: What you get in five working days
  intro: Four things, and they all stay with you.
  # tag: a short mark on the card, saying which file or folder it is.
  items:
    - tag: report
      title: A list of risky places
      text: >-
        Where an agent can break payments, access or personal data. For each
        place: the file, the line and what is wrong.
    - tag: test/guards
      title: Checks that already work
      text: >-
        They run by themselves on every change. Fast ones first, slow ones
        after. Old problems do not have to be fixed at once. The check counts
        them and sets a rule: “fewer is fine, more is not”.
    - tag: CLAUDE.md
      title: Rules for your agent
      text: >-
        A short file the agent reads before every task. And a check that runs
        before the code is even sent.
    - tag: 90 days
      title: A 90-day plan
      text: >-
        What to add next, who is responsible, and which numbers show whether
        things got better.
  note: >-
    Nothing goes into your code without your yes. A red check is a question
    for your team: fix the code, or write down why it is allowed here.

process:
  title: How it goes
  # Two parts: what is free and what belongs to the paid work.
  phases:
    - kind: free
      label: First, the free part
      steps:
        - title: You install the free plugin
          text: >-
            Three commands. The plugin writes the first checks for your
            project and shows what they found. [How it works](/plugin/).
        - title: We talk for 20 minutes
          text: >-
            You share your screen with the findings. Your code stays with
            you, and no access is needed. Then you decide whether you need the
            paid work. If the plugin is enough, you stop there.
    - kind: paid
      label: "Then the paid work: five working days"
      steps:
        - title: We sign an agreement, you give access
          text: >-
            The agreement covers confidentiality and which AI reads your code.
            Access is needed to one project, for one week. The work happens in
            GitHub's cloud, next to your code. I do not copy it to my computer.
        - title: The agent reads the code, I check the findings
          text: >-
            The search starts where a mistake costs the most: payments,
            access, personal data and what your own AI is allowed to do. Every
            finding is a check that fails on your code. You can run it
            yourself.
        - title: The checks come to you for approval
          text: >-
            They do not go straight into the code. They come as proposed
            changes. Your team reviews and accepts them.
        - title: You get everything
          text: >-
            The list of risky places, the rules for the agent and the plan.
            You close my access, and the cloud environment is deleted with it.
            The checks stay as ordinary files in your project. There is no
            subscription.

proof:
  title: How it worked in my project
  intro: >-
    Every project has its own numbers. Here are the ones I measured in mine.
    Catch Club is a platform for paid Telegram communities. I built it alone,
    with the Claude Code agent, from {periodStart} to {periodEnd}. The agent
    wrote most of the code.
  # The three main numbers, shown large.
  big:
    - value: "{mergedPrs}"
      label: changes accepted into the main code in eight months
      source: GitHub
    - value: "{unitTests}"
      label: tests pass on every change
      source: check run {ciRun}
    - value: "{l30MainRed}"
      label: times in 30 days the checks failed on the main version of the code
      source: "to {l30Until}"
      zero: true
  # The other numbers, as a grid.
  stats:
    - value: "{integrationTests}"
      label: tests on a real database
    - value: "{guardSuites}"
      label: sets of checks for the main rules
    - value: "{ciFull}"
      label: is how long the full check of one change takes
    - value: "{tsLines}"
      label: lines of code, tests not counted
    - value: "{l30RedPct}"
      label: of check runs in 30 days were red, all of them in drafts
    - value: "{l30WithTestsPct}"
      label: of code changes came with a change to the tests
    - value: "{l30Median} min"
      label: is how long a check usually takes
    - value: "{l30MergedPrs}"
      label: changes accepted in the last 30 days
  # A picture made of dots: each dot is one run of the checks.
  runsTitle: "The check runs in 30 days, to {l30Until}"
  runs:
    all: "Every run that finished: {l30Green} green and {l30Red} red. Each dot is one run."
    main: "Runs on the main version of the code: {l30MainGreen} green, none red."
  limitsTitle: What these numbers do not say
  limits:
    - >-
      This is one person's experience. A large team needs the same system set
      up differently: every check needs an owner.
    - >-
      There are no tests that click through the site by themselves. The
      Telegram screens are checked by hand, with a checklist.
    - Mistakes that did reach people are not counted separately yet.
  more: >-
    Every number, where it comes from and how to check it again is on
    [the numbers page](/case/).

pricing:
