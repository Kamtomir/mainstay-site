faq:
  title: Questions
  items:
    - q: What exactly do you check, and what do you not check?
      a: >-
        The places where a mistake costs the most: money, access, personal
        data and what your own AI is allowed to do. Building features and
        fixing your code are not part of the work. Neither are tests that
        click through the site, load testing or penetration tests.
    - q: How do you decide which risks matter for our project?
      a: >-
        First I learn who your customers are and what your product does for
        them. Then I look at its strong points and its bottleneck. From that
        it is clear where a mistake would cost you the most. Usually it is
        money, access or personal data.
    - q: Why five working days?
      a: >-
        That is the time for one project. It covers the whole job: the
        expensive places, the checks for them, the rules for the agent and the
        plan. Access is needed for that one week, and then you close it. The
        price does not change along the way.
    - q: "Who reads our code: you or an AI?"
      a: >-
        An AI agent, Claude Code. I direct it, check every finding and am
        responsible for the report. A finding is not the model's opinion. It
        is a check that fails on your code. You can run it again and see for
        yourself.
    - q: Will our code go to the company that makes the AI?
      a: >-
        Yes, to Anthropic: the agent is their Claude Code. It runs under my
        commercial account, not a personal subscription. On those terms your
        code is not used to train models, and our agreement says so. If your
        rules do not allow that, the agent runs under your account.
        [What Anthropic does with the data](https://code.claude.com/docs/en/data-usage).
    - q: What access do you need?
      a: >-
        To one project, for a week: to read the code, see the check results
        and propose changes. Access to the live site and your passwords is
        not needed. I work in GitHub's cloud, next to your code, and do not
        copy it to my computer. When you close the access, the cloud
        environment is deleted.
    - q: Can it be done with no access at all?
      a: >-
        Yes. Then your developer runs the agent on their own machine, under
        your AI account. I guide the work on a call and check the findings on
        a shared screen. This takes some of your developer's time.
    - q: Do you sign an NDA?
      a: >-
        Yes, before I see any code. My agreement already covers
        confidentiality. If you have your own NDA, send it. The first call
        does not need one: I do not see your code.
    - q: Will you change our code?
      a: >-
        No. I add checks and rules for the agent, and only as proposed
        changes. Your team decides whether to accept them. A red check is a
        finding. You decide whether to fix the code or record an exception.
    - q: How is this better than an AI bot that reviews code?
      a: >-
        A bot gives an opinion. One today, another tomorrow. A check gives the
        same answer for the same code. And the rule is written down in your
        project, where everyone can see it. You can use both.
    - q: What if we do not use Claude Code?
      a: >-
        The checks do not care who wrote the code. They work with another
        agent and with a person. The plugin is made for Claude Code, but the
        same setup can be done by hand in about {setupMinutes} minutes.
    - q: Do you guarantee there will be no mistakes?
      a: >-
        No. A check catches the kind of mistake it was written for. Each one
        says honestly what it cannot see. But a mistake that already happened
        gets a check of its own. Next time the check catches it.
    - q: What is the difference between the free plugin and the paid work?
      a: >-
        The plugin sets up general checks: for example, that every API route
        checks sign-in. You run it yourself, in your own Claude Code. The paid
        work is about the rules of your product: your money, your access,
        your data. First they have to be found in your code. That is the five
        days, with the report, the checks, the rules and the plan.
    - q: What if we only install the free plugin?
      a: >-
        It writes the first checks for your project, runs them and shows the
        findings. It fixes nothing and saves nothing without your yes. If that
        is enough, you do not need the paid work.

about:
  title: About me
  paragraphs:
    - >-
      My name is {authorName}. I am an engineer. For eight months I built
      [Catch Club]({productUrl}) alone. It is a platform for paid Telegram
      communities: an owner's dashboard, bots, mini apps, payments and AI
      agents. Most of the code was written by the Claude Code agent.
    - >-
      To keep it from falling apart, I put together a system of checks along
      the way. Later I turned it into an open project,
      [mainstay](https://github.com/Kamtomir/mainstay). It is free.
    - This service is the same system, set up for your project.

