faq:
  title: Questions about the plugin
  items:
    - q: Why checks and not lint rules?
      a: >-
        Where a linter is enough, use a linter. A check is an ordinary test of
        about twenty lines, in the same language as your tests. It sees many
        files at once, SQL and settings. And the exceptions are written next
        to the rule, each with a reason.
    - q: Does the plugin download or send anything?
      a: >-
        No. It is one instruction for Claude Code and a copy of the files it
        installs. The files come from the plugin's own folder; it pulls
        nothing from the network. It runs inside your Claude Code session,
        like any task of yours.
    - q: Which frameworks does it know?
      a: >-
        For the API route check: Next.js, SvelteKit, Express, Fastify
        and Hono. With others it first describes what it found and asks before
        it writes.
    - q: A check flags a file where this is done on purpose. What do I do?
      a: >-
        Put the file into the exceptions and state the reason. Without a
        reason the exception is not accepted. And when it is no longer needed,
        the check says so itself.
    - q: Why is the project not on npm?
      a: >-
        On purpose. These are files you copy and read in full. Nothing updates
        without you, and you do not depend on me.

closing:
  title: And the rules of your product?
  text: >-
    The plugin sets up the general checks. The rules about your money, your
    access and your data have to be found first. That is the paid work.
