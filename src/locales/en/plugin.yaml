# The plugin page. Developers read it, but the language is the same: short
# sentences, plain words. The facts come from README.md of the open mainstay
# project and from the plugin's instruction; the commands themselves live in
# src/data/case.ts.

meta:
  title: "mainstay: a free plugin with checks for Claude Code"
  description: >-
    Three commands, and your project has its first checks. They read the code
    and fail when a main rule is broken. Free, and the code is open.

hero:
  title: "A free plugin: the first checks in three commands"
  lead: >-
    mainstay is my open set of checks for projects where an AI agent writes
    the code. The checks read the code itself and fail when a rule is broken.
    The plugin sets them up in your project through Claude Code. Free.

install:
  title: How to install
  steps:
    - text: In Claude Code, connect the catalogue with the plugin.
      command: marketplaceAdd
    - text: Install the plugin.
      command: install
    - text: Open your project and run the setup.
      command: setup
  after: The setup first asks what to install. Only then does it write anything.

does:
  title: What it does
  items:
    - "Asks what you need: the checks, the order they run in, the rules for the agent."
    - >-
      Writes the first checks for your project. Every API route checks that
      the person is signed in. Server keys do not get into the code for the
      browser. Neither does anything that breaks older iPhones.
    - >-
      Counts how many times type checking is switched off in the code
      (`as any`, `@ts-ignore`). And sets a rule: fewer is fine, more is not.
    - >-
      Adds a run of the checks on every change, a check before the code is
      sent, and a rules file, `CLAUDE.md`.
    - Runs all of it and shows what it found.

doesNot:
  title: What it does not do
  items:
    - It fixes nothing and saves nothing without your yes.
    - >-
      It does not touch the product code. A red check is a finding for you,
      not a task for the agent.
    - It does not overwrite your files. It compares, shows the difference and asks.
    - >-
      It adds nothing extra. Installing it installs no packages and adds no
      hooks or MCP servers to your sessions.
    - It does not send code or open a pull request unless you ask.

output:
  title: What a found mistake looks like
  intro: >-
    The check says three things: which rule is broken, in which file, and what
    to write instead.
  after: >-
    Then there are two honest options: fix the code, or write down why this
    file is allowed. Weakening the check itself to get green is not one of them.

needs:
  title: What it needs
  items:
    - A project in git with a `package.json` file.
    - Node 20 or newer.
    - Vitest. If it is missing, the setup offers to add it.
    - Claude Code, to run the plugin.

manual:
  title: If you do not use Claude Code
  text: >-
    The same setup can be done by hand. These are ordinary files: you copy
    them, and they are yours. The project is not on npm, on purpose. The
    README has a step-by-step setup that takes {setupMinutes} minutes for a
    TypeScript project. Below is the first check from it.
    [Open the setup](https://github.com/Kamtomir/mainstay#15-minute-setup-for-a-typescript-repository).

layers:
  title: What the whole system is made of
  intro: >-
    There are six parts. The plugin sets up three: the rule checks with a
    counter for old debt, the order they run in, and the rules for the agent.
    The rest are in the open project, ready to take.

